html { background: radial-gradient(70rem 45rem at 0% -15%, #262B5C 0%, transparent 70%) var(--sky); color: var(--sand); }

@keyframes form-leave { 0% { transform: none; } 18% { transform: rotateX(-7deg) translateY(-.5rem); opacity: 1; } 100% { transform: rotateX(88deg) translateY(1.5rem) scale(.92); opacity: 0; } }

@keyframes sent-arrive { from { transform: rotateX(-80deg); opacity: 0; } 40% { opacity: 1; } to { transform: none; } }
.sent-check { flex: none; width: 3.25rem; height: 3.25rem; fill: none; stroke: var(--turq); stroke-linecap: round; stroke-linejoin: round; }
.sent-check circle { stroke-width: 2.5; stroke-dasharray: 145; }

.is-arriving .sent-check circle { animation: draw .6s .25s ease-out both; --len: 145; }
.is-arriving .sent-check path { animation: draw .35s .7s ease-out both; --len: 34; }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }

/* Mobile: identity becomes a compact header, then one column */

/* Latest Work and Contact side by side, sized like the roles line */

<script type="application/json" id="site-data">{"views":[{"id":"about","title":"About","html":"<p>\n<b>TL;DR:<\/b> Linux nerd → DevOps wrangler → indie gamedev. 🐧 → ☁️ → 🎮\n<\/p>\n\n<hr>"},{"id":"quest-log","title":"🗺️ The Quest Log","html":"<ul class=\"org-ul\">\n<li><b>2025 – now · 🎮 Founder, <a href=\"https://enchant.games\">Land of Enchantment Games<\/a><\/b> <br>\nMy personal indie game studio, based in New Mexico.<\/li>\n<li><b>Also cooking 🍳: my side projects<\/b>\n<ul class=\"org-ul\">\n<li><b><a href=\"https://merecatholicity.com\">merecatholicity.com<\/a><\/b> (<a href=\"https://github.com/merecatholicity/merecatholicity.com\">Git<\/a>): my eclectic ecumenical project. It includes a self-published book, <i>Mere Catholicity<\/i> (public domain, typeset in LaTeX for PDF, paperback and Logos), a library of the Fathers, councils and classics re-typeset from public-domain sources, and <b>merecat<\/b> 🐈, an AI research librarian that answers from the library with citations. I built it serverless: a PureScript, lit-js and Tailwind front end over a custom headless API backend on Cloudflare Workers, with D1 (SQLite), R2 (S3-compatible storage) and Durable Objects for real-time chat. A GitHub Actions CI/CD system ships both the application and its Terraform infrastructure, with approval gates before production, staged rollouts and nightly tests against production. For the community side I borrowed the best bits of the old internet: 4chan-style auth, Snapchat-style DMs, Signal-style end-to-end encryption, and Facebook-style profiles and walls.<\/li>\n<li><b><a href=\"https://stasislinux.org\">stasislinux.org<\/a><\/b> (<a href=\"https://codeberg.org/sta_sis/stasis\">Git<\/a>): my own Linux distro, the natural follow-through of my years as a package maintainer on KISS Linux with Dylan Araps.<\/li>\n<li><b><a href=\"https://github.com/a-schaefers/backseat-driver\">backseat-driver<\/a><\/b>: my tutor for keeping AI-era programmers' fundamentals sharp.<\/li>\n<li><b><a href=\"https://github.com/a-schaefers/.emacs.d\">.emacs.d<\/a><\/b>: my Emacs config. It starts in about 0.2s, with everything deferred through use-package. It prefers built-ins (eglot, flymake), runs on vertico/corfu/tree-sitter, and binds the same SLIME-style keys in every language.<\/li>\n<\/ul><\/li>\n<li><b>2020 – 2025 · ☁️ DevOps @ Upgrade, Inc. · Immaculata Studios, LLC · Skvare, LLC<\/b> <br>\nHerded Kubernetes, Terraform (5k+ lines of homegrown modules), AWS, CI/CD pipelines, monitoring, and a Postfix server that sent a million emails a month without landing in spam. Rode the industry's evolution from LAMP-stack monoliths to IaC-driven cloud microservices, right up to the arrival of AI automation, which is when I turned to solo gamedev.<\/li>\n<li><b>2017 – 2020 · 🐧 Open Source Hermit<\/b> <br>\nSpent 10+ hours a day learning Linux from the kernel up. Maintained packages for KISS Linux, wrote docs for Funtoo, and built <a href=\"https://github.com/a-schaefers/themelios\">Themelios<\/a> (a NixOS ZFS-on-root installer) and <a href=\"https://github.com/a-schaefers/spartan-emacs\">Spartan Emacs<\/a>. Got commits merged upstream (<a href=\"https://bugzilla.kernel.org/show_bug.cgi?id=206741\">e.g. libcap<\/a>). Also went viral on Hacker News by booting my Linux distro with Emacs as init (<a href=\"https://news.ycombinator.com/item?id=28439275\">systemE<\/a>).<\/li>\n<\/ul>\n\n<hr>"},{"id":"off-the-clock","title":"🎧 Off the clock","html":"<p>\nProfessional music recording, and I play guitar. 🎸 Big fan of electronic music, house and techno. I enjoy vacationing in Greece. 🇬🇷 Born and raised in the Pacific Northwest, and an avid fly fisherman. 🎣\n<\/p>\n\n<hr>"},{"id":"slop-shelf","title":"🤖 The slop shelf","html":"<p>\nMy secondary GitHub, <a href=\"https://github.com/el-sloppo\">@el-sloppo<\/a>, is where I push my favorite AI slop projects. Most of them live under <a href=\"https://github.com/emacs-os\">Emacs-OS<\/a>:\n<\/p>\n\n<ul class=\"org-ul\">\n<li><b><a href=\"https://github.com/emacs-os/embr.el\">embr.el<\/a><\/b>: a web browser inside Emacs. Emacs is the display server and headless Chromium is the renderer, streamed over CDP screencast. It has EXWM-style key passthrough, optional Vimium-style modal navigation, and a native C rendering path built on the Emacs canvas patch. It doubles as a proof of concept for getting that patch mainlined.<\/li>\n<li><b><a href=\"https://github.com/emacs-os/jellyfin-emms-mpv.el\">jellyfin-emms-mpv.el<\/a><\/b>: browse and play your Jellyfin library from Emacs. Music goes through EMMS and video through mpv, with poster galleries, and playback position syncs back so \"Continue Watching\" stays accurate.<\/li>\n<li><b><a href=\"https://github.com/emacs-os/elcava\">elcava<\/a><\/b>: a cava clone in pure Emacs Lisp. It captures system audio from PipeWire, runs the FFT in Elisp, and draws a live Unicode spectrum in a buffer.<\/li>\n<li><b><a href=\"https://github.com/emacs-os/el-init\">el-init<\/a><\/b>: Emacs as PID 1, for real this time. It's a systemd-inspired service supervisor written in Emacs Lisp, with a dependency graph, targets, an <code>M-x elinit<\/code> dashboard and an <code>elinitctl<\/code> CLI, plus an optional static-build patchset that turns Emacs into an actual init. It's the spiritual sequel to systemE and the core of Emacs-OS.<\/li>\n<\/ul>\n\n<hr>"},{"id":"inquiries","title":"✉️ Inquiries","html":"<div id=\"contact-mount\"><\/div>"}],"blog":{"title":"Blog","intro":"<p>\nLorem ipsum dolor sit amet, consectetur adipiscing elit. Placeholder intro until the real posts land.\n<\/p>","perPage":10},"posts":[{"slug":"2026-10-09-est-do-exercitation-esse","date":"2026-10-09","dateLabel":"October 9, 2026","title":"Est do exercitation esse","excerpt":"<p>\nSit amet sunt duis adipiscing quis in sit anim commodo ut dolor consectetur laboris.<\/p>","html":"<p>\nEt consectetur aute laboris sit sunt irure elit est. Velit velit in est sit irure in exercitation sit labore dolor. Qui sed al <script>
// Profile photo: grows out of the avatar into a large view; click anywhere or Esc shrinks it back.
(function () {
  var thumb = document.querySelector('.profile-zoom');
  var dialog = document.querySelector('.photo-dialog');
  var big = dialog.querySelector('img');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)');
  function morph(reverse) {
    var a = thumb.getBoundingClientRect(), b = big.getBoundingClientRect();
    var dx = a.left + a.width / 2 - (b.left + b.width / 2);
    var dy = a.top + a.height / 2 - (b.top + b.height / 2);
    var frames = [
      { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + a.width / b.width + ')', borderRadius: '50%' },
      { transform: 'none', borderRadius: '24px' }
    ];
    if (reverse) frames.reverse();
    return big.animate(frames, { duration: reduce.matches ? 0 : 450, easing: 'cubic-bezier(.2, .9, .25, 1)' });
  }
  thumb.addEventListener('click', function () {
    dialog.classList.remove('is-closing');
    dialog.showModal();
    thumb.classList.add('is-open');
    morph(false);
  });
  function close() {
    if (dialog.classList.contains('is-closing')) return;
    dialog.classList.add('is-closing');
    morph(true).onfinish = function () {
      dialog.close();
      dialog.classList.remove('is-closing');
      thumb.classList.remove('is-open');
      thumb.focus({ preventScroll: true });
    };
  }
  dialog.addEventListener('click', close);
  dialog.addEventListener('cancel', function (e) { e.preventDefault(); close(); });
})();
</script>

<script>
// Emacs course: thumbnail until played, then a YouTube embed. Episode buttons swap the video.
(function () {
  var course = document.querySelector('.course');
  var player = course.querySelector('.course-player');
  var now = course.querySelector('.course-now');
  var current = course.querySelector('.course-episodes [aria-current]');
  function embed(btn) {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + btn.dataset.id + '?autoplay=1&rel=0';
    f.title = 'Episode ' + btn.textContent + ': ' + btn.dataset.title;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    player.replaceChildren(f);
  }
  function select(btn) {
    current.removeAttribute('aria-current');
    btn.setAttribute('aria-current', 'true');
    current = btn;
    now.children[0].textContent = btn.textContent;
    now.childNodes[1].textContent = ' ' + btn.dataset.title + ' ';
    now.children[1].textContent = btn.dataset.len;
    var play = player.querySelector('.course-play');
    if (play) {
      play.querySelector('img').src = 'https://i.ytimg.com/vi/' + btn.dataset.id + '/hqdefault.jpg';
      play.setAttribute('aria-label', 'Play episode ' + btn.textContent);
    } else {
      embed(btn);
    }
  }
  player.addEventListener('click', function (e) { if (e.target.closest('.course-play')) embed(current); });
  course.querySelector('.course-episodes').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn && btn !== current) select(btn);
  });
})();
</script>
