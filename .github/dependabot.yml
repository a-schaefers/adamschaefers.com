# Keeps the SHA-pinned actions current: the repository requires every `uses:` to name a
# commit, so a bump is a pull request that changes a hash and its version comment. And
# wrangler (package.json, the only npm dependency: CI deploys with it). Dependabot's pull
# requests are not the owner's: each waits for the owner's approval (owner-merge.yml
# approves only the owner's), and a merged wrangler bump redeploys every Worker.
# Pull requests carry no secrets, so a Dependabot branch reaches nothing.
# Not covered: check.yml's Debian image digest, bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      toolchain:
        update-types: ["minor", "patch"]
